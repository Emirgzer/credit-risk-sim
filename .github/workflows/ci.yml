name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: End-to-end smoke run
        run: |
          python -m creditsim generate --n 5000 --out data/borrowers.csv
          python -m creditsim validate --data data/borrowers.csv
          python -m creditsim train --data data/borrowers.csv --out-dir reports
